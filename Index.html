<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .todo-container {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        ul {
            list-style: none;
            margin-top: 20px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        li.completed span {
            text-decoration: line-through;
            color: gray;
        }

        li span {
            cursor: pointer;
            flex: 1;
        }

        .delete-btn {
            background: #dc3545;
            padding: 7px 10px;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background: #a71d2a;
        }
    </style>
</head>

<body>

    <div class="todo-container">

        <h1>📝 To-Do List</h1>

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>

    </div>

    <script>

        function addTask() {

            const input = document.getElementById("taskInput");
            const taskText = input.value.trim();

            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            const li = document.createElement("li");

            const span = document.createElement("span");
            span.textContent = taskText;

            // Mark task as completed
            span.onclick = function () {
                li.classList.toggle("completed");
            };

            // Delete button
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";

            deleteButton.onclick = function () {
                li.remove();
            };

            li.appendChild(span);
            li.appendChild(deleteButton);

            document.getElementById("taskList").appendChild(li);

            input.value = "";
            input.focus();
        }

        // Press Enter to add task
        document.getElementById("taskInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });

    </script>

</body>
</html>
